# Configuración para Render (https://render.com): New → Blueprint → este repositorio.
services:
  - type: web
    name: apuestas-is1
    runtime: docker
    plan: free
    region: frankfurt
    branch: main
    # /ping responde sin base de datos ni plantilla (HU-85): el health check del deploy no depende de la portada
    healthCheckPath: /ping
    envVars:
      # Contraseña del creador de apuestas (obligatoria): Render la pide al crear el servicio
      - key: CREADOR_PASSWORD
        sync: false
      # Independent secret used to sign persistent browser login cookies
      - key: REMEMBER_ME_KEY
        sync: false
      # Mail delivery is required for new account verification in the public deployment
      - key: MAIL_HOST
        sync: false
      - key: MAIL_PORT
        value: "2525"
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: APUESTAS_CORREO_REMITENTE
        sync: false
      # Base de datos PostgreSQL permanente (Neon, ver README). Sin ellas usa H2 y los datos se borran al reiniciar
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      # Opcional: si se define, se crea también usuario@apuestas.es con esta contraseña
      - key: USUARIO_PASSWORD
        sync: false
      # Opcional: clave de football-data.org para los partidos reales
      - key: FOOTBALL_DATA_TOKEN
        sync: false
      # Opcional: "true" carga una vez datos de demostración (jugadores con apuestas, partidos, una liga)
      - key: DEMO_DATOS
        sync: false
