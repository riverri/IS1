name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Reintentar descarga de Maven
        run: |
          for intento in 1 2 3; do
            if ./mvnw -v; then
              exit 0
            fi
            if [ "$intento" -lt 3 ]; then
              echo "No se pudo preparar Maven (intento $intento/3); esperando antes de reintentar."
              sleep $((intento * 10))
            fi
          done
          echo "No se pudo descargar Maven tras 3 intentos." >&2
          exit 1
      # verify: pruebas, cobertura mínima (JaCoCo: 90 % de líneas y 75 % de ramas) y análisis estático (SpotBugs)
      - name: Compilar, ejecutar pruebas y analizar
        run: ./mvnw -B verify
      # Cobertura de las pruebas (JaCoCo): el resumen sale en la página de la ejecución y el informe completo,
      # en el artefacto «cobertura-jacoco» (abrir index.html)
      - name: Resumen de la cobertura
        if: always()
        run: |
          if [ -f target/site/jacoco/jacoco.csv ]; then
            awk -F, 'NR > 1 { im += $4; ic += $5; bm += $6; bc += $7; lm += $8; lc += $9 }
              END { printf "## Cobertura de las pruebas (JaCoCo)\n\n| | Cubierto |\n|---|---:|\n| Líneas | %.1f %% |\n| Ramas | %.1f %% |\n| Instrucciones | %.1f %% |\n",
                    100 * lc / (lm + lc), 100 * bc / (bm + bc), 100 * ic / (im + ic) }' \
              target/site/jacoco/jacoco.csv >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Guardar el informe de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobertura-jacoco
          path: target/site/jacoco/

  # Las mismas pruebas contra PostgreSQL, la base de datos del servidor:
  # comprueba que las migraciones de db/migration/postgresql siguen al día con las entidades.
  postgresql:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: apuestas
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/apuestas
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Reintentar descarga de Maven
        run: |
          for intento in 1 2 3; do
            if ./mvnw -v; then
              exit 0
            fi
            if [ "$intento" -lt 3 ]; then
              echo "No se pudo preparar Maven (intento $intento/3); esperando antes de reintentar."
              sleep $((intento * 10))
            fi
          done
          echo "No se pudo descargar Maven tras 3 intentos." >&2
          exit 1
      - name: Ejecutar pruebas con PostgreSQL
        run: ./mvnw -B test

  # Accesibilidad en un navegador real (HU-97 a HU-101): axe con las reglas de WCAG 2.1 AA en las páginas
  # principales, en modo claro y oscuro; uso con el teclado y sin desplazamiento lateral a 320 px y al 200 %.
  # Arranca con los datos de demostración, para revisar también páginas con contenido (ranking, historial, ligas).
  accesibilidad:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Reintentar descarga de Maven
        run: |
          for intento in 1 2 3; do
            if ./mvnw -v; then
              exit 0
            fi
            if [ "$intento" -lt 3 ]; then
              echo "No se pudo preparar Maven (intento $intento/3); esperando antes de reintentar."
              sleep $((intento * 10))
            fi
          done
          echo "No se pudo descargar Maven tras 3 intentos." >&2
          exit 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: a11y/package-lock.json
      - name: Compilar la aplicación
        run: ./mvnw -B -DskipTests package
      - name: Arrancar la aplicación
        run: |
          DEMO_DATOS=true java -jar target/apuestas-*.jar > app.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://localhost:8080/ping && break; sleep 2; done
      - name: Instalar el navegador
        working-directory: a11y
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Comprobar la accesibilidad
        working-directory: a11y
        run: node comprobar.js
      # De extremo a extremo: registrarse, apostar, cancelar, combinada, el creador resuelve y se cobra, salir
      - name: Recorrido de un jugador de principio a fin
        if: success() || failure()
        working-directory: a11y
        run: node e2e.js
      - name: Registro de la aplicación si algo falla
        if: failure()
        run: tail -100 app.log

  # Pruebas de mutación (PIT) de la lógica con pruebas unitarias: falla si menos del 80 % de los cambios que mete PIT
  # hacen fallar alguna prueba. El informe completo, en el artefacto «mutacion-pit» (abrir index.html)
  mutacion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Reintentar descarga de Maven
        run: |
          for intento in 1 2 3; do
            if ./mvnw -v; then
              exit 0
            fi
            if [ "$intento" -lt 3 ]; then
              echo "No se pudo preparar Maven (intento $intento/3); esperando antes de reintentar."
              sleep $((intento * 10))
            fi
          done
          echo "No se pudo descargar Maven tras 3 intentos." >&2
          exit 1
      - name: Pruebas de mutación
        run: ./mvnw -B -Pmutacion test-compile org.pitest:pitest-maven:mutationCoverage -Djacoco.skip=true
      - name: Resumen de las mutaciones
        if: always()
        run: |
          if [ -f target/pit-reports/mutations.csv ]; then
            awk -F, '{ total++; if ($6 == "KILLED" || $6 == "TIMED_OUT" || $6 == "MEMORY_ERROR") muertas++ }
              END { printf "## Pruebas de mutación (PIT)\n\n%d de %d mutaciones detectadas: %.1f %%\n", muertas, total, 100 * muertas / total }' \
              target/pit-reports/mutations.csv >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Guardar el informe de mutación
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutacion-pit
          path: target/pit-reports/
