name: Wiki

# Publica en la wiki de GitHub las páginas de docs/wiki cada vez que cambian en main,
# los diagramas de docs/diseno/uml.md como la página "Diagramas UML"
# y las actas de docs/scrum/sprints/sprint-N.md como "Primer Sprint", "Segundo Sprint"…
# Solo añade o actualiza páginas: las que se escriben a mano en la wiki no se tocan.
on:
  push:
    branches: [main]
    paths: ['docs/wiki/**', 'docs/diseno/uml.md', 'docs/scrum/sprints/sprint-*.md']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Copiar las páginas a la wiki
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git clone "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git" wiki
          cp docs/wiki/*.md wiki/
          cp docs/diseno/uml.md wiki/Diagramas-UML.md
          ordinales=(Primer Segundo Tercer Cuarto Quinto Sexto Séptimo)
          for acta in docs/scrum/sprints/sprint-[0-9]*.md; do
            n=$(basename "$acta" .md); n=${n#sprint-}
            cp "$acta" "wiki/${ordinales[n-1]}-Sprint.md"
          done
          cd wiki
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "La wiki ya está al día"
          else
            git commit -m "Actualizar la wiki desde el repositorio (${GITHUB_SHA::7})"
            git push
          fi
