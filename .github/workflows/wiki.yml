name: Wiki

# Publica en la wiki de GitHub las páginas de docs/wiki cada vez que cambian en main.
# Solo añade o actualiza páginas: las que se escriben a mano en la wiki (por ejemplo, las de los sprints) no se tocan.
on:
  push:
    branches: [main]
    paths: ['docs/wiki/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Copiar las páginas a la wiki
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git clone "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git" wiki
          cp docs/wiki/*.md wiki/
          cd wiki
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "La wiki ya está al día"
          else
            git commit -m "Actualizar la wiki desde docs/wiki (${GITHUB_SHA::7})"
            git push
          fi
