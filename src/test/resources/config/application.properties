# Las pruebas usan una base de datos en memoria, independiente de ./datos, creada con las mismas migraciones
spring.datasource.url=jdbc:h2:mem:apuestas-test
# Sin descargas automáticas de precios de criptomonedas: las pruebas no dependen de Internet
apuestas.cripto.actualizacion-automatica=false
# Cada configuración de prueba distinta (otras propiedades, @MockitoBean) es otro contexto de Spring con su propio
# grupo de conexiones, y Spring los guarda abiertos para reutilizarlos. Con 10 conexiones por grupo (lo normal),
# PostgreSQL (100 como mucho) se queda sin sitio en la CI. Con 5 sobran: las pruebas de concurrencia usan hasta 4 a la vez
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
# Sin plantillas inventadas: cada prueba crea los jugadores que necesita
apuestas.plantillas-ejemplo=false
