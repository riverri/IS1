# Perfil para compartir la aplicación por Internet con un túnel (compartir.bat / compartir.sh).
# La consola de H2 no tiene contraseña: con el túnel cualquiera podría entrar en la base de datos.
spring.h2.console.enabled=false
# El túnel llega por HTTPS: así las redirecciones (login, logout...) mantienen https://
server.forward-headers-strategy=framework
# El enlace de recuperar la contraseña usa apuestas.url-publica (ver application.properties). La dirección del
# túnel cambia cada vez: si se configura el correo, hay que definir URL_PUBLICA con el enlace https://…trycloudflare.com
# Con el túnel la aplicación es pública y la contraseña del creador del README también:
# CREADOR_PASSWORD es obligatoria y se aplica al creador aunque ya exista (compartir.bat la pide).
apuestas.creador.password=${CREADOR_PASSWORD:}
apuestas.creador.password-fija=true
