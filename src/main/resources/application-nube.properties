# Perfil para publicar la aplicación en un servidor de Internet (Render, ver README).
# La consola de H2 no tiene contraseña: con la aplicación pública cualquiera podría entrar en la base de datos.
spring.h2.console.enabled=false
# El servidor recibe las peticiones por HTTPS y las pasa a la aplicación: así las redirecciones mantienen https://
server.forward-headers-strategy=framework
# Todo va por HTTPS: la cookie de sesión solo se envía cifrada (Secure), nunca por http:// en claro
server.servlet.session.cookie.secure=true
# Render solo detecta el puerto si la aplicación escucha en IPv4 (0.0.0.0). Sin esto, Java escucha en IPv6 (::),
# Render dice "No open HTTP ports detected on 0.0.0.0" y el deploy falla por tiempo de espera del health check
server.address=0.0.0.0
# Base del enlace de recuperar la contraseña: URL_PUBLICA si se define; si no, la que Render da a cada servicio
# en la variable RENDER_EXTERNAL_URL (https://apuestas-is1.onrender.com)
apuestas.url-publica=${URL_PUBLICA:${RENDER_EXTERNAL_URL:http://localhost:${server.port}}}
# Las contraseñas de prueba del README son públicas: aquí la del creador es obligatoria (CREADOR_PASSWORD)
# y el usuario de prueba solo se crea si se define USUARIO_PASSWORD.
apuestas.creador.password=${CREADOR_PASSWORD:}
apuestas.creador.password-fija=true
apuestas.usuario.password=${USUARIO_PASSWORD:}
apuestas.seguridad.remember-me-key=${REMEMBER_ME_KEY:}
apuestas.seguridad.remember-me-secure=true
apuestas.correo.mostrar-enlaces-locales=false
# Rama auxiliar de demostración: se sobrescribe en esta rama, nunca en el flujo normal de main.
apuestas.registro.auxiliar-habilitado=true
# Keep-alive (RNF-01): Render apaga la web gratuita tras 15 minutos sin peticiones. La propia aplicación se visita
# cada 10 minutos por su dirección pública (KEEP_ALIVE_URL si se define; si no, RENDER_EXTERNAL_URL, que da Render)
apuestas.keep-alive.url=${KEEP_ALIVE_URL:${RENDER_EXTERNAL_URL:}}
