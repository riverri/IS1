# Perfil para publicar la aplicación en un servidor de Internet (Render, ver README).
# La consola de H2 no tiene contraseña: con la aplicación pública cualquiera podría entrar en la base de datos.
spring.h2.console.enabled=false
# El servidor recibe las peticiones por HTTPS y las pasa a la aplicación: así las redirecciones mantienen https://
server.forward-headers-strategy=framework
# Las contraseñas de prueba del README son públicas: aquí la del creador es obligatoria (CREADOR_PASSWORD)
# y el usuario de prueba solo se crea si se define USUARIO_PASSWORD.
apuestas.creador.password=${CREADOR_PASSWORD:}
apuestas.usuario.password=${USUARIO_PASSWORD:}
