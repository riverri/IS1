<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/comun :: cabeza('Mi cuenta')}"></head>
<body>
<header th:replace="~{fragments/comun :: cabecera}"></header>
<main class="estrecho">
    <h1 th:text="'Hola, ' + ${usuario.nombre}">Hola</h1>
    <div class="tarjeta-saldo">
        <span class="tarjeta-saldo-titulo">Saldo disponible</span>
        <span class="tarjeta-saldo-valor" th:text="${#numbers.formatDecimal(usuario.saldo, 1, 'POINT', 2, 'COMMA')} + ' monedas'">1.000,00 monedas</span>
        <span class="tarjeta-saldo-email" th:text="${usuario.email}">usuario@apuestas.es</span>
    </div>
    <div class="tarjeta recarga">
        <span class="ventaja-icono" aria-hidden="true">🎁</span>
        <div>
            <strong>Próxima recarga gratuita de
                <span th:text="${#numbers.formatDecimal(importeRecarga, 1, 'POINT', 0, 'COMMA')}">200</span> monedas</strong>
            <p class="aviso">
                <span th:text="${@formato.dia(proximaRecarga)}">jue 8 oct</span> a las
                <span th:text="${@formato.hora(proximaRecarga)}">19:12</span>
            </p>
        </div>
    </div>
    <a class="boton boton-bloque" th:href="@{/eventos}">Ver partidos</a>
</main>
</body>
</html>
