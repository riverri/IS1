<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/comun :: cabeza('Confirmar correo')}" ></head>
<body>
<header th:replace="~{fragments/comun :: cabecera}"></header>
<main class="estrecho">
    <h1>Confirmar correo electrónico</h1>
    <p role="alert" class="alerta alerta-error" th:if="${error}" th:text="${error}"></p>
    <th:block th:if="${valido}">
        <p>Confirma que quieres crear una cuenta con <strong th:text="${emailConfirmado}">correo</strong>
            y que puedes recibir mensajes en esa dirección.</p>
        <form th:action="@{/registro/confirmar}" method="post">
            <input type="hidden" name="token" th:value="${token}">
            <button class="boton boton-bloque" type="submit">Confirmar correo</button>
        </form>
    </th:block>
    <th:block th:unless="${valido}">
        <p>El enlace no es válido o ha caducado. Solicita uno nuevo para continuar.</p>
        <a class="boton boton-bloque" th:href="@{/registro}">Solicitar otro enlace</a>
    </th:block>
</main>
<footer th:replace="~{fragments/comun :: pie}"></footer>
</body>
</html>
