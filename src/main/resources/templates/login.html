<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/comun :: cabeza('Entrar')}"></head>
<body>
<header th:replace="~{fragments/comun :: cabecera}"></header>
<main class="acceso">
    <section th:replace="~{fragments/comun :: panelAcceso}"></section>
    <div class="tarjeta tarjeta-formulario">
        <h1>Iniciar sesión</h1>
        <p class="subtitulo">Bienvenido de nuevo</p>

        <p class="alerta alerta-exito" th:if="${param.registrado}">Cuenta creada. Ya puedes iniciar sesión.</p>
        <p class="alerta alerta-error" th:if="${param.error}">Email o contraseña incorrectos.</p>
        <p class="alerta alerta-exito" th:if="${param.logout}">Has cerrado sesión.</p>

        <form class="formulario" th:action="@{/login}" method="post">
            <label for="email">Email</label>
            <input id="email" name="email" type="email" autocomplete="username" required autofocus>

            <label for="password">Contraseña</label>
            <input id="password" name="password" type="password" autocomplete="current-password" required>

            <button class="boton boton-bloque" type="submit">Entrar</button>
        </form>
        <p class="pie-formulario">¿No tienes cuenta? <a th:href="@{/registro}">Regístrate</a></p>
    </div>
</main>
<footer th:replace="~{fragments/comun :: pie}"></footer>
</body>
</html>
