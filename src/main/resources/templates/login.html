<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/comun :: cabeza('Entrar')}"></head>
<body>
<header th:replace="~{fragments/comun :: cabecera}"></header>
<main class="estrecho">
    <h1>Iniciar sesión</h1>

    <p class="exito" th:if="${param.registrado}">Cuenta creada. Ya puedes iniciar sesión.</p>
    <p class="error" th:if="${param.error}">Email o contraseña incorrectos.</p>
    <p class="exito" th:if="${param.logout}">Has cerrado sesión.</p>

    <form class="formulario" th:action="@{/login}" method="post">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="username" required autofocus>

        <label for="password">Contraseña</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>

        <button class="boton" type="submit">Entrar</button>
    </form>
    <p>¿No tienes cuenta? <a th:href="@{/registro}">Regístrate</a></p>
</main>
</body>
</html>
