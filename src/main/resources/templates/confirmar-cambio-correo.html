<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/comun :: cabeza('Confirmar cambio de correo')}"></head>
<body>
<header th:replace="~{fragments/comun :: cabecera}"></header>
<main class="estrecho">
    <h1>Confirmar cambio de correo</h1>
    <p role="alert" class="alerta alerta-error" th:if="${error}" th:text="${error}"></p>
    <th:block th:if="${valido}">
        <p>Al confirmar, el nuevo correo pasará a ser tu identificador de inicio de sesión y se cerrarán tus sesiones abiertas.</p>
        <form th:action="@{/cuenta/correo/confirmar}" method="post">
            <input type="hidden" name="token" th:value="${token}">
            <button class="boton boton-bloque" type="submit">Confirmar nuevo correo</button>
        </form>
    </th:block>
    <th:block th:unless="${valido}">
        <p>El enlace no es válido o ha caducado. Solicita otro cambio desde Mi cuenta.</p>
        <a class="boton boton-bloque" th:href="@{/login}">Ir a iniciar sesión</a>
    </th:block>
</main>
<footer th:replace="~{fragments/comun :: pie}"></footer>
</body>
</html>
