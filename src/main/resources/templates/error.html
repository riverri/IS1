<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/comun :: cabeza('Error')}"></head>
<body>
<header th:replace="~{fragments/comun :: cabecera}"></header>
<main class="estrecho">
    <div class="tarjeta tarjeta-formulario centrado">
        <p class="codigo-error" th:text="${status}">404</p>
        <th:block th:switch="${status}">
            <h1 th:case="403">No tienes permiso para ver esta página</h1>
            <h1 th:case="404">Página no encontrada</h1>
            <h1 th:case="*">Algo ha ido mal</h1>
        </th:block>
        <a class="boton" th:href="@{/eventos}">Ir al catálogo</a>
    </div>
</main>
</body>
</html>
