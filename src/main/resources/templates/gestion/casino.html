<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/comun :: cabeza('Casino')}"></head>
<body>
<header th:replace="~{fragments/comun :: cabecera}"></header>
<main class="estrecho">
    <div class="tarjeta tarjeta-formulario">
        <h1>Configuración del casino</h1>
        <p class="alerta alerta-exito" th:if="${mensaje}" th:text="${mensaje}">Guardado</p>
        <p class="subtitulo">
            Ventaja de la casa ahora: ruleta europea
            <strong th:text="${#numbers.formatDecimal(configuracion.ventajaRuleta, 1, 'POINT', 2, 'COMMA')} + ' %'">2,70 %</strong>
            (fija: un 0 entre 37 números) · blackjack
            <strong th:text="'≈ ' + ${#numbers.formatDecimal(configuracion.ventajaBlackjack, 1, 'POINT', 2, 'COMMA')} + ' %'">≈ 1,05 %</strong>
            (orientativa, con estrategia básica: más barajas, pedir con 17 blando, pago 6:5 y no poder dividir la suben).</p>
        <form class="formulario" th:action="@{/gestion/casino}" th:object="${datosCasino}" method="post">
            <label class="casilla">
                <input type="checkbox" th:field="*{activo}">
                <span>Casino abierto (si lo cierras, nadie puede jugar)</span>
            </label>

            <label for="importeMinimo">Importe mínimo por apuesta</label>
            <input id="importeMinimo" type="number" step="0.01" th:field="*{importeMinimo}" th:errorclass="con-error">
            <span class="error-campo" th:if="${#fields.hasErrors('importeMinimo')}" th:text="${#fields.errors('importeMinimo')[0]}"></span>

            <label for="importeMaximo">Importe máximo por apuesta</label>
            <input id="importeMaximo" type="number" step="0.01" th:field="*{importeMaximo}" th:errorclass="con-error">
            <span class="error-campo" th:if="${#fields.hasErrors('importeMaximo')}" th:text="${#fields.errors('importeMaximo')[0]}"></span>

            <label for="barajas">Barajas del blackjack (1–8)</label>
            <input id="barajas" type="number" min="1" max="8" th:field="*{barajas}" th:errorclass="con-error">
            <span class="error-campo" th:if="${#fields.hasErrors('barajas')}" th:text="${#fields.errors('barajas')[0]}"></span>

            <label class="casilla">
                <input type="checkbox" th:field="*{bancaPideCon17Blando}">
                <span>La banca pide carta con 17 blando (sube la ventaja de la casa)</span>
            </label>

            <label for="pagoBlackjack">El blackjack paga</label>
            <select id="pagoBlackjack" th:field="*{pagoBlackjack}">
                <option th:each="p : ${pagos}" th:value="${p}" th:text="${p.texto}">3:2</option>
            </select>

            <div class="acciones-formulario">
                <button class="boton" type="submit">Guardar</button>
                <a class="boton boton-secundario" th:href="@{/gestion}">Volver al panel</a>
            </div>
        </form>
    </div>
</main>
<footer th:replace="~{fragments/comun :: pie}"></footer>
</body>
</html>
