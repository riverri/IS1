<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/comun :: cabeza('Escudo')}"></head>
<body>
<header th:replace="~{fragments/comun :: cabecera}"></header>
<main class="estrecho">
    <div class="tarjeta tarjeta-formulario">
        <div class="equipo-celda">
            <span th:replace="~{fragments/comun :: escudo(${equipo}, 'escudo-grande')}"></span>
            <h1 th:text="${equipo.nombre}">Real Madrid</h1>
        </div>
        <p class="subtitulo">Pega la dirección de una imagen (PNG o SVG). Déjalo vacío para mostrar las iniciales.</p>
        <form class="formulario" th:action="@{/gestion/equipos/{id}/escudo(id=${equipo.id})}" th:object="${escudo}" method="post">
            <label for="escudoUrl">Dirección del escudo</label>
            <input id="escudoUrl" type="url" th:field="*{escudoUrl}" th:errorclass="con-error"
                   placeholder="https://…/escudo.png">
            <span class="error-campo" th:if="${#fields.hasErrors('escudoUrl')}"
                  th:text="${#fields.errors('escudoUrl')[0]}"></span>
            <div class="acciones-formulario">
                <button class="boton" type="submit">Guardar</button>
                <a class="boton boton-secundario" th:href="@{/gestion}">Cancelar</a>
            </div>
        </form>
    </div>
</main>
</body>
</html>
