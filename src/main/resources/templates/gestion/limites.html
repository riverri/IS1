<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/comun :: cabeza('Límites de apuesta')}"></head>
<body>
<header th:replace="~{fragments/comun :: cabecera}"></header>
<main class="estrecho">
    <div class="tarjeta tarjeta-formulario">
        <h1>Límites de apuesta</h1>
        <p class="subtitulo">Se aplican a todas las apuestas nuevas: simples, combinadas y a largo plazo.</p>
        <form class="formulario" th:action="@{/gestion/limites}" th:object="${limites}" method="post">
            <label for="importeMinimo">Importe mínimo por apuesta</label>
            <input id="importeMinimo" type="number" step="0.01" min="0.01" th:field="*{importeMinimo}" th:errorclass="con-error">
            <span class="error-campo" th:if="${#fields.hasErrors('importeMinimo')}" th:text="${#fields.errors('importeMinimo')[0]}"></span>

            <label for="importeMaximo">Importe máximo por apuesta</label>
            <input id="importeMaximo" type="number" step="0.01" min="0.01" th:field="*{importeMaximo}" th:errorclass="con-error">
            <span class="error-campo" th:if="${#fields.hasErrors('importeMaximo')}" th:text="${#fields.errors('importeMaximo')[0]}"></span>

            <label for="maxSelecciones">Selecciones máximas en una combinada</label>
            <input id="maxSelecciones" type="number" step="1" min="2" max="30" th:field="*{maxSelecciones}" th:errorclass="con-error">
            <span class="error-campo" th:if="${#fields.hasErrors('maxSelecciones')}" th:text="${#fields.errors('maxSelecciones')[0]}"></span>

            <div class="acciones-formulario">
                <button class="boton" type="submit">Guardar</button>
                <a class="boton boton-secundario" th:href="@{/gestion}">Cancelar</a>
            </div>
        </form>
    </div>
</main>
</body>
</html>
