<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/comun :: cabeza('Registro')}"></head>
<body>
<header th:replace="~{fragments/comun :: cabecera}"></header>
<main class="acceso">
    <section th:replace="~{fragments/comun :: panelAcceso}"></section>
    <div class="tarjeta tarjeta-formulario">
        <h1>Crear cuenta</h1>
        <p class="subtitulo">Primero confirmaremos que puedes recibir correo. La cuenta solo se creará después.
            Recibes <strong th:text="${#numbers.formatDecimal(bienvenida, 1, 'POINT', 0, 'COMMA')}">1.000</strong>
            moneditas de bienvenida. No se usa dinero real.</p>

        <form class="formulario" th:action="@{/registro}" th:object="${solicitud}" method="post" novalidate>
            <label for="email">Email</label>
            <input id="email" type="email" th:field="*{email}" th:errorclass="con-error" autocomplete="email">
            <span class="error-campo" th:if="${#fields.hasErrors('email')}" th:text="${#fields.errors('email')[0]}"></span>

            <button class="boton boton-bloque" type="submit">Enviar enlace de confirmación</button>
        </form>
        <p class="pie-formulario">¿Ya tienes cuenta? <a th:href="@{/login}">Inicia sesión</a></p>
    </div>
</main>
<footer th:replace="~{fragments/comun :: pie}"></footer>
</body>
</html>
