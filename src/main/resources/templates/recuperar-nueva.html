<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/comun :: cabeza('Contraseña nueva')}"></head>
<body>
<header th:replace="~{fragments/comun :: cabecera}"></header>
<main class="acceso">
    <section th:replace="~{fragments/comun :: panelAcceso}"></section>
    <div class="tarjeta tarjeta-formulario">
        <h1>Contraseña nueva</h1>

        <th:block th:unless="${enlaceValido}">
            <p class="alerta alerta-error">El enlace ha caducado o ya se ha usado. Pide uno nuevo.</p>
            <p class="pie-formulario"><a th:href="@{/recuperar}">Pedir otro enlace</a></p>
        </th:block>

        <form th:if="${enlaceValido}" class="formulario" th:action="@{/recuperar/nueva}" th:object="${nuevaPassword}"
              method="post" novalidate>
            <input type="hidden" th:field="*{token}">

            <label for="nueva">Contraseña nueva</label>
            <input id="nueva" type="password" th:field="*{nueva}" th:errorclass="con-error" autocomplete="new-password">
            <span class="error-campo" th:if="${#fields.hasErrors('nueva')}" th:text="${#fields.errors('nueva')[0]}"></span>

            <label for="confirmacion">Repite la contraseña</label>
            <input id="confirmacion" type="password" th:field="*{confirmacion}" th:errorclass="con-error" autocomplete="new-password">
            <span class="error-campo" th:if="${#fields.hasErrors('confirmacion')}" th:text="${#fields.errors('confirmacion')[0]}"></span>

            <button class="boton boton-bloque" type="submit">Guardar la contraseña</button>
        </form>
    </div>
</main>
<footer th:replace="~{fragments/comun :: pie}"></footer>
</body>
</html>
