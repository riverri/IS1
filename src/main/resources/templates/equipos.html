<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/comun :: cabeza('Equipos')}"></head>
<body>
<header th:replace="~{fragments/comun :: cabecera}"></header>
<main>
    <h1>Equipos y deportistas</h1>
    <div class="tabla">
        <table>
            <thead>
            <tr><th>Nombre</th><th>Deporte</th><th>Competiciones</th><th>Calidad (0-10)</th></tr>
            </thead>
            <tbody>
            <tr th:each="e : ${equipos}">
                <td th:text="${e.nombre}">Real Madrid</td>
                <td th:text="${e.deporte.nombre}">Fútbol</td>
                <td>
                    <span class="etiqueta" th:each="c : ${e.competiciones}" th:text="${c.nombre}">LaLiga</span>
                </td>
                <td th:text="${e.calidad}">9.5</td>
            </tr>
            <tr th:if="${#lists.isEmpty(equipos)}">
                <td colspan="4">No hay equipos registrados.</td>
            </tr>
            </tbody>
        </table>
    </div>
</main>
</body>
</html>
