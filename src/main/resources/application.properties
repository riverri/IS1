spring.application.name=apuestas

# Base de datos H2 en memoria (se reinicia en cada arranque).
# Consola web: http://localhost:8080/h2-console  (JDBC URL: jdbc:h2:mem:apuestas, usuario: sa, sin contraseña)
spring.datasource.url=jdbc:h2:mem:apuestas
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true

# Hibernate crea las tablas a partir de las entidades; después se carga data.sql
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.defer-datasource-initialization=true
spring.jpa.open-in-view=false
