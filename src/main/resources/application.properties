spring.application.name=apuestas

# Base de datos H2 en memoria (se reinicia en cada arranque; los datos de ejemplo están en DatosIniciales.java).
# Consola web: http://localhost:8080/h2-console  (JDBC URL: jdbc:h2:mem:apuestas, usuario: sa, sin contraseña)
spring.datasource.url=jdbc:h2:mem:apuestas
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true

# Hibernate crea las tablas a partir de las entidades
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

# Moneditas virtuales (HU-14)
apuestas.saldo.bienvenida=1000
apuestas.saldo.recarga-importe=200
apuestas.saldo.recarga-periodo=7d
