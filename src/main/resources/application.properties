spring.application.name=apuestas

# Base de datos H2 guardada en el archivo ./datos/apuestas.mv.db (los datos se conservan entre arranques).
# Para empezar de cero, borra la carpeta datos/ con la aplicación parada.
# Consola web: http://localhost:8080/h2-console  (JDBC URL: jdbc:h2:file:./datos/apuestas, usuario: sa, sin contraseña)
spring.datasource.url=jdbc:h2:file:./datos/apuestas
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true

# Hibernate crea o actualiza las tablas a partir de las entidades
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Moneditas virtuales (HU-14)
apuestas.saldo.bienvenida=1000
apuestas.saldo.recarga-importe=200
apuestas.saldo.recarga-periodo=7d

# Límites de apuesta (HU-07)
apuestas.limites.max-selecciones=10

# API de datos deportivos: football-data.org (fila 13 del backlog)
# La clave se lee de la variable de entorno FOOTBALL_DATA_TOKEN. Sin clave, la sincronización está desactivada.
apuestas.api.url=https://api.football-data.org/v4
apuestas.api.token=${FOOTBALL_DATA_TOKEN:}
apuestas.api.competiciones=PD,CL
apuestas.api.dias-atras=7
apuestas.api.dias-adelante=21
apuestas.api.zona-horaria=Europe/Madrid
apuestas.api.intervalo=PT30M
