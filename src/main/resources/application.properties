# Configuración de la aplicación: cada línea es "clave=valor". Spring Boot las lee al arrancar.
# ${VARIABLE:valor} significa: usa la variable de entorno VARIABLE si existe y, si no, "valor".
# Las claves "spring.*" y "server.*" son de Spring; las "apuestas.*" son nuestras y las leen las clases
# con @Value o @ConfigurationProperties (por ejemplo, usuarios.SaldoProperties lee apuestas.saldo.*).
spring.application.name=apuestas
# Zona horaria de la aplicación: las fechas de los partidos y "ahora" se calculan en esta zona,
# sea cual sea la del servidor
apuestas.zona-horaria=Europe/Madrid
# Puerto: 8080, o el que indique el servidor con la variable PORT (Render)
server.port=${PORT:8080}
# Dirección pública de la web: es la base del enlace de recuperar la contraseña (HU-17).
# Se fija aquí y no se toma de la petición, porque las cabeceras Host y X-Forwarded-Host las puede falsear
# cualquiera. En local es esta; en Render la pone el perfil nube; con el túnel se puede definir URL_PUBLICA.
apuestas.url-publica=${URL_PUBLICA:http://localhost:${server.port}}

# Base de datos H2 guardada en el archivo ./datos/apuestas.mv.db (los datos se conservan entre arranques).
# Para empezar de cero, borra la carpeta datos/ con la aplicación parada.
# Consola web: http://localhost:8080/h2-console  (JDBC URL: jdbc:h2:file:./datos/apuestas, usuario: sa, sin contraseña)
spring.datasource.url=jdbc:h2:file:./datos/apuestas
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true

# Las tablas las crea Flyway con los scripts de src/main/resources/db/migration: h2/ en local y
# postgresql/ en el servidor (ver README). Hibernate solo comprueba que las entidades coinciden con la base de datos.
spring.flyway.locations=classpath:db/migration/{vendor}
spring.jpa.hibernate.ddl-auto=validate
# Bases de datos creadas antes de usar Flyway: se toman como versión 1
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
# La conexión con la base de datos se cierra al terminar el servicio, antes de pintar la página: por eso
# las relaciones que usan las plantillas se cargan con FetchType.EAGER
spring.jpa.open-in-view=false

# Contraseñas de los usuarios de prueba (se crean en el primer arranque).
# Se pueden cambiar con las variables de entorno CREADOR_PASSWORD y USUARIO_PASSWORD.
apuestas.creador.password=${CREADOR_PASSWORD:creador123}
apuestas.usuario.password=${USUARIO_PASSWORD:usuario123}
apuestas.seguridad.remember-me-key=${REMEMBER_ME_KEY:local-development-remember-key-change-before-deploy}
apuestas.seguridad.remember-me-secure=false

# Plantillas inventadas para los equipos de LaLiga sin jugadores, para poder jugar a la liga fantasy sin la API
apuestas.plantillas-ejemplo=true

# Moneditas virtuales (HU-14). recarga-periodo=7d: una recarga gratuita cada 7 días
apuestas.saldo.bienvenida=1000
apuestas.saldo.recarga-importe=200
apuestas.saldo.recarga-periodo=7d

# Correo para recuperar la contraseña (HU-17). Sin servidor configurado, el enlace se escribe en la consola.
# Para enviarlo de verdad (por ejemplo con Gmail y una "contraseña de aplicación"), definir las variables
# MAIL_HOST, MAIL_PORT, MAIL_USERNAME y MAIL_PASSWORD.
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
# Tiempos de espera del correo (ms). Sin ellos, JavaMail espera sin límite: los correos salen desde el único hilo de las
# tareas programadas (sincronización, alertas, resumen semanal, keep-alive), y un servidor de correo que no contesta
# las pararía todas; sin keep-alive, Render apaga la web a los 15 minutos. Como los de la API (TiemposDeEsperaConfig)
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
# En producción puede ser distinto del usuario SMTP (por ejemplo, el remitente verificado de Brevo).
# Se mantiene MAIL_USERNAME como alternativa para no romper configuraciones existentes.
apuestas.correo.remitente=${APUESTAS_CORREO_REMITENTE:${MAIL_USERNAME:no-responder@apuestas.es}}
apuestas.correo.mostrar-enlaces-locales=true

# Los límites de apuesta (HU-07) se guardan en la base de datos y se cambian en Gestión → Límites de apuesta

# API de datos deportivos: football-data.org (fila 13 del backlog)
# La clave se lee de la variable de entorno FOOTBALL_DATA_TOKEN. Sin clave, la sincronización está desactivada.
apuestas.api.url=https://api.football-data.org/v4
apuestas.api.token=${FOOTBALL_DATA_TOKEN:}
apuestas.api.competiciones=PD,CL
# Plantillas: en el plan gratuito la Champions no trae jugadores, así que se descargan de la liga de cada equipo
# (LaLiga, Premier, Bundesliga, Serie A, Ligue 1, Liga Portugal y Eredivisie). Solo se rellenan equipos que ya tenemos.
apuestas.api.competiciones-plantillas=PD,PL,BL1,SA,FL1,PPL,DED
apuestas.api.dias-atras=7
apuestas.api.dias-adelante=21
apuestas.api.zona-horaria=${apuestas.zona-horaria}
apuestas.api.intervalo=PT30M

# Precios de las criptomonedas (HU-69): API pública de CoinGecko, en euros (1 monedita = 1 euro).
# No pide clave; con una clave gratuita "Demo" (variable COINGECKO_CLAVE) admite más peticiones por minuto.
apuestas.cripto.url=https://api.coingecko.com/api/v3
apuestas.cripto.clave=${COINGECKO_CLAVE:}
apuestas.cripto.actualizacion-automatica=true
apuestas.cripto.intervalo=PT2M

# Tiempo de carga (HU-85). Las páginas, los estilos y el JSON viajan comprimidos con gzip si el navegador lo acepta
server.compression.enabled=true
server.compression.mime-types=text/html,text/css,text/plain,application/javascript,application/json,image/svg+xml
server.compression.min-response-size=1KB
# La hoja de estilos se pide como /css/estilos-<huella>.css (la huella cambia cuando cambia el archivo), así que el
# navegador la puede guardar un año: si la editamos, la URL es otra y se descarga la nueva
spring.web.resources.chain.strategy.content.enabled=true
spring.web.resources.chain.strategy.content.paths=/**
spring.web.resources.cache.cachecontrol.max-age=365d
spring.web.resources.cache.cachecontrol.cache-public=true
# Keep-alive (HU-85): GET a <url>/ping cada intervalo para que Render no apague la web. Vacío en local: no hace nada.
# En el servidor lo activa application-nube.properties con la dirección que da Render
apuestas.keep-alive.url=${KEEP_ALIVE_URL:}
apuestas.keep-alive.intervalo=PT10M

# Datos de demostración (config.DatosDemo): seis jugadores con apuestas ganadas, perdidas y activas, partidos
# próximos, una combinada, una supercuota y una liga. Se cargan una sola vez si se define DEMO_DATOS=true
# (por ejemplo, en Render para enseñar la web); si ya están, no se repiten
apuestas.demo.activa=${DEMO_DATOS:false}

# Actuator exposes health and metrics. Health shows only UP/DOWN; SeguridadConfig restricts metrics to CREADOR.
# /ping remains Render's health check and does not query the database (HU-85).
management.endpoints.web.exposure.include=health,metrics
management.endpoint.health.show-details=never
management.health.mail.enabled=false
# Record request latency percentiles by URI, method, and status code.
management.metrics.distribution.percentiles.http.server.requests=0.5,0.95
# Cada línea del registro lleva el identificador de la petición que la ha escrito (ver IdPeticion)
logging.pattern.level=%5p [%X{peticion:-}]

# Las colecciones y relaciones perezosas se cargan de 50 en 50 y no una a una: una lista de 20 apuestas hace una
# consulta para sus selecciones, no 20 (el problema «N+1», ver ConsultasWebTest)
spring.jpa.properties.hibernate.default_batch_fetch_size=50
