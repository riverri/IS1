spring.application.name=apuestas
# Puerto: 8080, o el que indique el servidor con la variable PORT (Render)
server.port=${PORT:8080}

# Base de datos H2 guardada en el archivo ./datos/apuestas.mv.db (los datos se conservan entre arranques).
# Para empezar de cero, borra la carpeta datos/ con la aplicación parada.
# Consola web: http://localhost:8080/h2-console  (JDBC URL: jdbc:h2:file:./datos/apuestas, usuario: sa, sin contraseña)
spring.datasource.url=jdbc:h2:file:./datos/apuestas
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true

# Las tablas las crea Flyway con los scripts de src/main/resources/db/migration: h2/ en local y
# postgresql/ en el servidor (ver README). Hibernate solo comprueba que las entidades coinciden con la base de datos.
spring.flyway.locations=classpath:db/migration/{vendor}
spring.jpa.hibernate.ddl-auto=validate
# Bases de datos creadas antes de usar Flyway: se toman como versión 1
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.jpa.open-in-view=false

# Contraseñas de los usuarios de prueba (se crean en el primer arranque).
# Se pueden cambiar con las variables de entorno CREADOR_PASSWORD y USUARIO_PASSWORD.
apuestas.creador.password=${CREADOR_PASSWORD:creador123}
apuestas.usuario.password=${USUARIO_PASSWORD:usuario123}

# Moneditas virtuales (HU-14)
apuestas.saldo.bienvenida=1000
apuestas.saldo.recarga-importe=200
apuestas.saldo.recarga-periodo=7d

# Los límites de apuesta (HU-07) se guardan en la base de datos y se cambian en Gestión → Límites de apuesta

# API de datos deportivos: football-data.org (fila 13 del backlog)
# La clave se lee de la variable de entorno FOOTBALL_DATA_TOKEN. Sin clave, la sincronización está desactivada.
apuestas.api.url=https://api.football-data.org/v4
apuestas.api.token=${FOOTBALL_DATA_TOKEN:}
apuestas.api.competiciones=PD,CL
# Plantillas: en el plan gratuito la Champions no trae jugadores, así que se descargan de la liga de cada equipo
# (LaLiga, Premier, Bundesliga, Serie A, Ligue 1, Liga Portugal y Eredivisie). Solo se rellenan equipos que ya tenemos.
apuestas.api.competiciones-plantillas=PD,PL,BL1,SA,FL1,PPL,DED
apuestas.api.dias-atras=7
apuestas.api.dias-adelante=21
apuestas.api.zona-horaria=Europe/Madrid
apuestas.api.intervalo=PT30M
